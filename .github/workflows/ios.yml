name: iOS build

# Free macOS build machine (public repo = unlimited minutes).
# No Mac of our own needed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project CoBuddy.xcodeproj \
            -scheme CoBuddy \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tail -n 60

      - name: List built products
        if: always()
        run: find ~/Library/Developer/Xcode/DerivedData -name "CoBuddy.app" -maxdepth 6 2>/dev/null || true
